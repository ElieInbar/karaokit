[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karaoke-he"
version = "0.1.0"
description = "Pipeline de generation de videos karaoke pour des chansons en hebreu"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchaudio",
    "whisperx",
    "stable-ts",
    "pyannote.audio",
    "audio-separator",
    "audioread",
    "ctc-forced-aligner @ git+https://github.com/MahmoudAshraf97/ctc-forced-aligner.git",
    "pymkv2",
    "mutagen",
    "requests",
    "typer",
    "pillow",
    "python-bidi",
    "arabic-reshaper",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
]

[project.optional-dependencies]
deploy = ["modal"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
