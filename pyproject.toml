[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karaokit"
version = "0.1.0"
description = "Turn any song into a karaoke video with a word-by-word highlight (Hebrew, Arabic, English, French, Spanish, Russian)."
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchaudio",
    "stable-ts",
    "audio-separator[cpu]",
    "audioread",
    "ctc-forced-aligner @ git+https://github.com/MahmoudAshraf97/ctc-forced-aligner.git",
    "pymkv2",
    "requests",
    "typer",
    "pillow",
    "python-bidi",
    "arabic-reshaper",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "yt-dlp",
    "fast-langdetect",
    "modal",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
karaoke_he = ["assets/fonts/*.ttf", "assets/fonts/*.txt", "web/static/*"]
