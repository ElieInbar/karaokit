<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>karaoke_he</title>
<style>
  :root {
    --bg: #f0f0f5;
    --card-bg: #ffffff;
    --text: #1a1a2e;
    --text-secondary: #6a6a80;
    --border: #e2e2ec;
    --accent: #1a1a2e;
    --accent-contrast: #ffffff;
    --track-bg: #e8e8f0;
    --success-bg: #e2fde5;
    --success-text: #1c6b2e;
    --error-bg: #fde2e2;
    --error-text: #9b1c1c;
    --warning-bg: #fff6d9;
    --warning-text: #7a5b00;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0d16;
      --card-bg: #17172a;
      --text: #f0f0f5;
      --text-secondary: #a0a0b8;
      --border: #2a2a42;
      --accent: #ffd200;
      --accent-contrast: #1a1a2e;
      --track-bg: #26263c;
      --success-bg: #123321;
      --success-text: #7fe3a0;
      --error-bg: #3a1616;
      --error-text: #ff9a9a;
      --warning-bg: #3a2f0a;
      --warning-text: #ffd76b;
    }
  }

  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 48px 16px;
    display: flex;
    justify-content: center;
  }

  .card {
    width: 100%;
    max-width: 640px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
  }

  h1 {
    font-size: 1.5rem;
    margin: 0 0 4px;
  }

  .subtitle {
    color: var(--text-secondary);
    font-size: 0.9rem;
    margin: 0 0 28px;
  }

  .field {
    margin-bottom: 18px;
  }

  .field label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .field .hint {
    font-weight: 400;
    color: var(--text-secondary);
    font-size: 0.8rem;
  }

  input[type=text], input[type=file], select, textarea {
    width: 100%;
    padding: 10px 12px;
    font-size: 0.95rem;
    font-family: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
  }

  input:focus, select:focus, textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  textarea { resize: vertical; }

  .row { display: flex; gap: 12px; }
  .row > .field { flex: 1; }

  .autocomplete { position: relative; }

  .suggestions {
    list-style: none;
    margin: 4px 0 0;
    padding: 4px;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    z-index: 10;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    max-height: 260px;
    overflow-y: auto;
  }

  .suggestions[hidden] { display: none; }

  .suggestions li {
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
  }

  .suggestions li .s-title { font-weight: 600; }
  .suggestions li .s-artist { color: var(--text-secondary); }
  .suggestions li .s-album { color: var(--text-secondary); font-size: 0.8rem; }

  .suggestions li:hover, .suggestions li.active { background: var(--track-bg); }

  button {
    width: 100%;
    margin-top: 8px;
    padding: 13px 20px;
    font-size: 1rem;
    font-weight: 600;
    color: var(--accent-contrast);
    background: var(--accent);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  button:disabled { opacity: 0.65; cursor: default; }

  button.secondary {
    width: auto;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--border);
    padding: 8px 14px;
    font-size: 0.85rem;
  }

  .source-toggle { display: flex; gap: 18px; font-size: 0.9rem; margin-bottom: 10px; }
  .source-toggle label { display: flex; align-items: center; gap: 6px; font-weight: 400; cursor: pointer; }
  .source-toggle input { margin: 0; }

  .youtube-row { display: flex; gap: 8px; }
  .youtube-row input { flex: 1; }
  .youtube-row button { flex-shrink: 0; width: auto; margin-top: 0; }

  .lyrics-check-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }

  .lyrics-status { font-size: 0.85rem; font-weight: 600; }
  .lyrics-status.found { color: var(--success-text); }
  .lyrics-status.not-found { color: var(--error-text); }
  .lyrics-status.checking { color: var(--text-secondary); font-weight: 400; }

  .lyrics-preview {
    margin-top: 10px;
    margin-bottom: 18px;
    padding: 12px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    max-height: 240px;
    overflow-y: auto;
    white-space: pre-wrap;
    font-size: 0.9rem;
    line-height: 1.5;
  }

  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid var(--accent-contrast);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }

  button:disabled .spinner { display: inline-block; }

  @keyframes spin { to { transform: rotate(360deg); } }

  #status {
    margin-top: 24px;
    padding: 16px;
    border-radius: 10px;
    background: var(--track-bg);
    display: none;
  }

  #status.error { background: var(--error-bg); color: var(--error-text); }
  #status.done { background: var(--success-bg); color: var(--success-text); }

  .stage-label { font-size: 0.9rem; font-weight: 600; margin-bottom: 10px; }

  .progress-track {
    width: 100%;
    height: 8px;
    border-radius: 4px;
    background: var(--track-bg);
    overflow: hidden;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: width 0.3s ease;
  }

  .progress-track.indeterminate .progress-fill {
    width: 40% !important;
    animation: indeterminate 1.3s ease-in-out infinite;
  }

  @keyframes indeterminate {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(250%); }
  }

  video {
    width: 100%;
    border-radius: 8px;
    margin-top: 14px;
    display: block;
  }

  a.download {
    display: inline-block;
    margin-top: 4px;
    font-weight: 600;
    color: inherit;
  }

  .warnings {
    margin-top: 14px;
    padding: 12px 14px;
    background: var(--warning-bg);
    color: var(--warning-text);
    border-radius: 8px;
    font-size: 0.85rem;
  }

  .warnings ul { margin: 6px 0 0; padding-left: 20px; }
  .warnings li { margin-bottom: 4px; }
</style>
</head>
<body>
<div class="card">
  <h1>karaoke_he</h1>
  <p class="subtitle">Turn a song into a karaoke video with an animated highlight.</p>

  <form id="job-form">
    <div class="field">
      <label>Audio source</label>
      <div class="source-toggle">
        <label><input type="radio" name="source-mode" value="file" id="source-file" checked> Upload a file</label>
        <label><input type="radio" name="source-mode" value="youtube" id="source-youtube"> Paste a YouTube link</label>
      </div>
    </div>

    <div class="field" id="file-source-field">
      <label for="file">Audio file</label>
      <input type="file" id="file" name="file" accept="audio/*" required>
    </div>

    <div class="field" id="youtube-source-field" hidden>
      <label for="youtube-url">YouTube link</label>
      <div class="youtube-row">
        <input type="text" id="youtube-url" name="youtube_url" placeholder="https://www.youtube.com/watch?v=...">
        <button type="button" class="secondary" id="fetch-youtube-btn">
          <span class="spinner"></span>
          <span>Fetch info</span>
        </button>
      </div>
      <span class="lyrics-status" id="youtube-status" hidden></span>
    </div>

    <div class="row">
      <div class="field autocomplete">
        <label for="artist">Artist</label>
        <input type="text" id="artist" name="artist" autocomplete="off" required>
        <ul class="suggestions" id="artist-suggestions" hidden></ul>
      </div>
      <div class="field autocomplete">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" autocomplete="off" required>
        <ul class="suggestions" id="title-suggestions" hidden></ul>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="album">Album <span class="hint">(optional)</span></label>
        <input type="text" id="album" name="album">
      </div>
      <div class="field">
        <label for="language">Language <span class="hint" id="language-detected-hint"></span></label>
        <select id="language" name="language">
          <option value="heb" selected>Hebrew</option>
          <option value="eng">English</option>
          <option value="fra">French</option>
          <option value="spa">Spanish</option>
          <option value="rus">Russian</option>
          <option value="ara">Arabic</option>
        </select>
      </div>
    </div>

    <div class="lyrics-check-row">
      <button type="button" class="secondary" id="check-lyrics-btn">
        <span class="spinner"></span>
        <span>Check lyrics</span>
      </button>
      <span class="lyrics-status" id="lyrics-status" hidden></span>
      <button type="button" class="secondary" id="review-lyrics-btn" hidden>Review lyrics</button>
    </div>
    <div class="lyrics-preview" id="lyrics-preview" hidden></div>

    <div class="field">
      <label for="lyrics">Lyrics <span class="hint">(optional — only needed if the song isn't found on LRCLIB)</span></label>
      <textarea id="lyrics" name="lyrics" rows="6" placeholder="Paste the lyrics here if you get a &quot;lyrics not found&quot; error"></textarea>
    </div>

    <button type="submit" id="generate-btn" disabled title="Check lyrics (or paste them below) first">
      <span class="spinner"></span>
      <span class="btn-label">Generate karaoke video</span>
    </button>
  </form>

  <div id="status">
    <div class="stage-label"></div>
    <div class="progress-track"><div class="progress-fill" style="width: 0%"></div></div>
    <div class="result"></div>
  </div>
</div>

<script>
const STAGE_LABELS = {
  queued: "Queued...",
  downloading: "Downloading audio from YouTube...",
  separating: "Separating vocals from instrumental (GPU)...",
  lyrics: "Fetching lyrics...",
  aligning: "Aligning lyrics to vocals...",
  rendering_subtitles: "Rendering karaoke highlight...",
  muxing: "Assembling final video...",
  done: "Done!",
  error: "Error",
};

// Alignment reports discrete named sub-steps rather than a continuous percentage; map them to a
// fixed progression instead.
const ALIGN_SUBSTEPS = [
  "loading alignment model",
  "loading vocals audio",
  "running acoustic model",
  "preparing text",
  "computing alignment",
];

// --- Artist/title autocomplete (backed by /api/suggestions -> LRCLIB search) ---

function setupAutocomplete(inputId, listId) {
  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);
  const artistInput = document.getElementById("artist");
  const titleInput = document.getElementById("title");
  const albumInput = document.getElementById("album");

  let debounceTimer = null;
  let abortController = null;
  let activeIndex = -1;

  function hide() {
    list.hidden = true;
    list.innerHTML = "";
    activeIndex = -1;
  }

  function render(suggestions) {
    list.innerHTML = "";
    suggestions.forEach((s, i) => {
      const li = document.createElement("li");
      li.innerHTML = `<div class="s-title">${escapeHtml(s.title)}</div>` +
        `<div class="s-artist">${escapeHtml(s.artist)}</div>` +
        (s.album ? `<div class="s-album">${escapeHtml(s.album)}</div>` : "");
      li.addEventListener("mousedown", (e) => {
        // mousedown (not click) so this fires before the input's blur event hides the list.
        e.preventDefault();
        artistInput.value = s.artist;
        titleInput.value = s.title;
        if (s.album) albumInput.value = s.album;
        hide();
      });
      list.appendChild(li);
    });
    list.hidden = suggestions.length === 0;
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  function updateActive() {
    [...list.children].forEach((li, i) => li.classList.toggle("active", i === activeIndex));
  }

  input.addEventListener("input", () => {
    clearTimeout(debounceTimer);
    const query = [artistInput.value, titleInput.value].map(v => v.trim()).filter(Boolean).join(" ");
    if (query.length < 2) {
      hide();
      return;
    }
    debounceTimer = setTimeout(async () => {
      if (abortController) abortController.abort();
      abortController = new AbortController();
      try {
        const res = await fetch(`/api/suggestions?q=${encodeURIComponent(query)}`, { signal: abortController.signal });
        if (!res.ok) return;
        render(await res.json());
      } catch (err) {
        if (err.name !== "AbortError") hide();
      }
    }, 300);
  });

  input.addEventListener("keydown", (e) => {
    if (list.hidden) return;
    if (e.key === "ArrowDown") {
      e.preventDefault();
      activeIndex = Math.min(activeIndex + 1, list.children.length - 1);
      updateActive();
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      activeIndex = Math.max(activeIndex - 1, -1);
      updateActive();
    } else if (e.key === "Enter" && activeIndex >= 0) {
      e.preventDefault();
      list.children[activeIndex].dispatchEvent(new MouseEvent("mousedown"));
    } else if (e.key === "Escape") {
      hide();
    }
  });

  input.addEventListener("blur", hide);
}

setupAutocomplete("artist", "artist-suggestions");
setupAutocomplete("title", "title-suggestions");

// --- Audio source toggle: upload a file, or paste a YouTube link (downloaded server-side as the
// pipeline's first stage). Disabling the inactive input excludes it from the submitted FormData
// entirely, rather than sending an empty value the backend would have to special-case. ---

const fileSourceField = document.getElementById("file-source-field");
const youtubeSourceField = document.getElementById("youtube-source-field");
const fileInput = document.getElementById("file");
const youtubeUrlInput = document.getElementById("youtube-url");
const fetchYoutubeBtn = document.getElementById("fetch-youtube-btn");
const youtubeStatus = document.getElementById("youtube-status");

function applySourceMode() {
  const mode = document.querySelector('input[name="source-mode"]:checked').value;
  const isFile = mode === "file";
  fileSourceField.hidden = !isFile;
  youtubeSourceField.hidden = isFile;
  fileInput.disabled = !isFile;
  fileInput.required = isFile;
  youtubeUrlInput.disabled = isFile;
  youtubeUrlInput.required = !isFile;
}

document.getElementById("source-file").addEventListener("change", applySourceMode);
document.getElementById("source-youtube").addEventListener("change", applySourceMode);
applySourceMode();

fetchYoutubeBtn.addEventListener("click", async () => {
  const url = youtubeUrlInput.value.trim();
  if (!url) {
    youtubeStatus.hidden = false;
    youtubeStatus.className = "lyrics-status not-found";
    youtubeStatus.textContent = "Paste a YouTube link first.";
    return;
  }

  fetchYoutubeBtn.disabled = true;
  youtubeStatus.hidden = false;
  youtubeStatus.className = "lyrics-status checking";
  youtubeStatus.textContent = "Fetching video info...";

  try {
    const res = await fetch(`/api/youtube-metadata?url=${encodeURIComponent(url)}`);
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    artistInput.value = data.suggested_artist;
    titleInput.value = data.suggested_title;
    resetLyricsCheck();
    youtubeStatus.className = "lyrics-status found";
    youtubeStatus.textContent = `✓ "${data.title}" — confirm the artist/title below, then check lyrics.`;
  } catch (err) {
    youtubeStatus.className = "lyrics-status not-found";
    youtubeStatus.textContent = "Could not fetch video info: " + err.message;
  } finally {
    fetchYoutubeBtn.disabled = false;
  }
});

// --- Lyrics check gate: the "Generate" button stays disabled until lyrics are either found on
// LRCLIB (confirmed via this check) or pasted manually into the lyrics textarea. ---

const artistInput = document.getElementById("artist");
const titleInput = document.getElementById("title");
const albumInput = document.getElementById("album");
const lyricsTextarea = document.getElementById("lyrics");
const checkLyricsBtn = document.getElementById("check-lyrics-btn");
const lyricsStatus = document.getElementById("lyrics-status");
const reviewLyricsBtn = document.getElementById("review-lyrics-btn");
const lyricsPreview = document.getElementById("lyrics-preview");
const generateBtn = document.getElementById("generate-btn");
const languageSelect = document.getElementById("language");
const languageDetectedHint = document.getElementById("language-detected-hint");

let lyricsConfirmed = false;
let lastCheckedText = null;
// Once the user picks a language themselves, stop overriding it with a detected guess - the
// detection is a convenience default, not something that should fight the user's own choice.
let languageManuallySet = false;
languageSelect.addEventListener("change", () => {
  languageManuallySet = true;
  languageDetectedHint.textContent = "";
});

function updateGenerateButtonState() {
  const manualLyrics = lyricsTextarea.value.trim().length > 0;
  generateBtn.disabled = !(lyricsConfirmed || manualLyrics);
  generateBtn.title = generateBtn.disabled ? "Check lyrics (or paste them below) first" : "";
}

function resetLyricsCheck() {
  lyricsConfirmed = false;
  lastCheckedText = null;
  lyricsStatus.hidden = true;
  reviewLyricsBtn.hidden = true;
  lyricsPreview.hidden = true;
  languageDetectedHint.textContent = "";
  updateGenerateButtonState();
}

[artistInput, titleInput, albumInput].forEach(el => el.addEventListener("input", resetLyricsCheck));
lyricsTextarea.addEventListener("input", updateGenerateButtonState);

checkLyricsBtn.addEventListener("click", async () => {
  const artist = artistInput.value.trim();
  const title = titleInput.value.trim();
  if (!artist || !title) {
    lyricsStatus.hidden = false;
    lyricsStatus.className = "lyrics-status not-found";
    lyricsStatus.textContent = "Enter an artist and title first.";
    return;
  }

  checkLyricsBtn.disabled = true;
  lyricsStatus.hidden = false;
  lyricsStatus.className = "lyrics-status checking";
  lyricsStatus.textContent = "Checking lyrics...";
  reviewLyricsBtn.hidden = true;
  lyricsPreview.hidden = true;

  try {
    const params = new URLSearchParams({ artist, title });
    if (albumInput.value.trim()) params.set("album", albumInput.value.trim());
    const inYoutubeMode = document.getElementById("source-youtube").checked;
    if (inYoutubeMode && youtubeUrlInput.value.trim()) {
      params.set("youtube_url", youtubeUrlInput.value.trim());
    }
    const res = await fetch(`/api/lyrics-check?${params}`);
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();

    if (data.found) {
      lyricsConfirmed = true;
      lastCheckedText = data.text;
      lyricsStatus.className = "lyrics-status found";
      if (data.source === "youtube_description") {
        lyricsStatus.textContent = "✓ Lyrics found in the video description";
        lyricsTextarea.value = data.text;
      } else {
        lyricsStatus.textContent = `✓ Lyrics found on LRCLIB${data.synced ? " (synced)" : ""}`;
      }
      reviewLyricsBtn.hidden = false;

      const option = data.detected_language && languageSelect.querySelector(`option[value="${data.detected_language}"]`);
      if (option) {
        if (!languageManuallySet) languageSelect.value = data.detected_language;
        languageDetectedHint.textContent = `(detected: ${option.textContent})`;
      }
    } else {
      lyricsConfirmed = false;
      lastCheckedText = null;
      lyricsStatus.className = "lyrics-status not-found";
      lyricsStatus.textContent = data.error
        ? `⚠ ${data.error}`
        : "✗ Not found on LRCLIB — paste the lyrics below to continue.";
    }
  } catch (err) {
    lyricsConfirmed = false;
    lyricsStatus.className = "lyrics-status not-found";
    lyricsStatus.textContent = "Lyrics check failed: " + err.message;
  } finally {
    checkLyricsBtn.disabled = false;
    updateGenerateButtonState();
  }
});

reviewLyricsBtn.addEventListener("click", () => {
  if (lastCheckedText === null) return;
  const showing = !lyricsPreview.hidden;
  lyricsPreview.hidden = showing;
  reviewLyricsBtn.textContent = showing ? "Review lyrics" : "Hide lyrics";
  if (!showing) lyricsPreview.textContent = lastCheckedText;
});

function progressPercent(stage, detail) {
  if (!detail) return null;
  if (stage === "downloading" || stage === "separating" || stage === "rendering_subtitles") {
    const m = /^(\d+)%$/.exec(detail);
    return m ? parseInt(m[1], 10) : null;
  }
  if (stage === "aligning") {
    const idx = ALIGN_SUBSTEPS.indexOf(detail);
    return idx >= 0 ? Math.round(((idx + 1) / ALIGN_SUBSTEPS.length) * 100) : null;
  }
  return null;
}

const form = document.getElementById("job-form");
const button = form.querySelector("button");
const statusDiv = document.getElementById("status");
const stageLabelDiv = statusDiv.querySelector(".stage-label");
const progressTrack = statusDiv.querySelector(".progress-track");
const progressFill = statusDiv.querySelector(".progress-fill");
const resultDiv = statusDiv.querySelector(".result");
let pollTimer = null;

function setProgress(stage, detail) {
  const pct = progressPercent(stage, detail);
  const label = STAGE_LABELS[stage] || stage;
  stageLabelDiv.textContent = detail && pct === null ? `${label} — ${detail}` : label;
  if (pct === null) {
    progressTrack.classList.add("indeterminate");
    progressFill.style.width = "40%";
  } else {
    progressTrack.classList.remove("indeterminate");
    progressFill.style.width = `${pct}%`;
  }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  clearInterval(pollTimer);
  const formData = new FormData(form);
  button.disabled = true;

  statusDiv.style.display = "block";
  statusDiv.className = "";
  resultDiv.innerHTML = "";
  setProgress("queued", null);

  let jobId;
  try {
    const res = await fetch("/jobs", { method: "POST", body: formData });
    if (!res.ok) throw new Error(await res.text());
    ({ job_id: jobId } = await res.json());
  } catch (err) {
    statusDiv.className = "error";
    stageLabelDiv.textContent = "Upload failed: " + err.message;
    progressTrack.style.display = "none";
    button.disabled = false;
    return;
  }

  pollTimer = setInterval(async () => {
    const res = await fetch(`/jobs/${jobId}`);
    const job = await res.json();

    if (job.status === "error") {
      clearInterval(pollTimer);
      statusDiv.className = "error";
      progressTrack.style.display = "none";
      let message = STAGE_LABELS.error + ": " + job.error;
      if (job.error && job.error.includes("No lyrics found")) {
        message += "<br><br>Paste the lyrics into the \"Lyrics\" field above and try again — " +
          "the separation step already ran, so it'll be reused and this will be faster.";
      }
      stageLabelDiv.innerHTML = message;
      button.disabled = false;
      return;
    }

    if (job.done) {
      clearInterval(pollTimer);
      statusDiv.className = "done";
      progressTrack.style.display = "none";
      stageLabelDiv.textContent = STAGE_LABELS.done;
      let html = `<a class="download" href="/jobs/${jobId}/video" download>Download video (.mkv)</a>` +
        `<video controls src="/jobs/${jobId}/video"></video>`;
      if (job.warnings && job.warnings.length) {
        html += `<div class="warnings">⚠️ ${job.warnings.length} passage(s) to double-check:` +
          `<ul>${job.warnings.map(w => `<li>${w}</li>`).join("")}</ul></div>`;
      }
      resultDiv.innerHTML = html;
      button.disabled = false;
      return;
    }

    setProgress(job.status, job.detail);
  }, 2000);
});
</script>
</body>
</html>
