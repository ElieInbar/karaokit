<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karaokit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%231c1917'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%233a332b' stroke-width='1'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23e2492f'/%3E%3Ccircle cx='16' cy='16' r='1.5' fill='%23f6f0e4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,700&display=swap" rel="stylesheet">
<style>
  /* "Vinyl" look: a record sleeve - cream paper, ink-black rules, one tomato-red accent. */
  :root {
    --page: #e9dfcd;
    --paper: #f6f0e4;
    --ink: #1c1917;
    --ink-soft: #57534e;
    --ink-faint: #a8a29e;
    --rule: #1c1917;
    --hairline: #d8ccb7;
    --accent: #e2492f;
    --accent-hover: #c93b23;
    --on-accent: #fbf6ec;
    --chip-on-bg: #1c1917;
    --chip-on-text: #f6f0e4;
    --groove-a: #1c1917;
    --groove-b: #2c2723;
    --success: #3f7d4f;
    --error: #b42318;
    --error-bg: #f8dfd6;
    --done-bg: #e3ead9;
    --warning-bg: #f4e5c2;
    --warning-text: #6b4e0b;
    --font-display: "Fraunces", Georgia, "Times New Roman", serif;
    --font-body: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #12100d;
      --paper: #1d1915;
      --ink: #f3ece0;
      --ink-soft: #b9b0a3;
      --ink-faint: #6f675e;
      --rule: #f3ece0;
      --hairline: #3a332b;
      --accent: #ef5a3c;
      --accent-hover: #ff6d4f;
      --on-accent: #1d1915;
      --chip-on-bg: #f3ece0;
      --chip-on-text: #1d1915;
      --groove-a: #0b0907;
      --groove-b: #3a332b;
      --success: #8fcf9c;
      --error: #ff9b85;
      --error-bg: #3a1a12;
      --done-bg: #1f2a1f;
      --warning-bg: #352a12;
      --warning-text: #f2cf7a;
    }
  }

  * { box-sizing: border-box; }

  /* `display: flex` on buttons etc. would otherwise override the `hidden` attribute. */
  [hidden] { display: none !important; }

  body {
    font-family: var(--font-body);
    background: var(--page);
    color: var(--ink);
    margin: 0;
    padding: 48px 16px;
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 640px;
    background: var(--paper);
    border-radius: 18px;
    padding: 0 36px 36px;
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.04), 0 18px 50px rgba(60, 40, 20, 0.12);
  }

  /* --- Masthead: title, tagline, a spinning record and a demo karaoke line --- */

  .masthead {
    position: relative;
    overflow: hidden;
    margin: 0 -36px;
    padding: 40px 36px 0;
    border-radius: 18px 18px 0 0;
  }

  .disc {
    position: absolute;
    right: -78px;
    top: -78px;
    width: 230px;
    height: 230px;
    border-radius: 50%;
    background: repeating-radial-gradient(circle, var(--groove-a) 0 2px, var(--groove-b) 2px 4px);
    animation: spin 12s linear infinite;
  }

  .disc::after {
    content: "";
    position: absolute;
    inset: 82px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: inset 0 0 0 26px var(--accent), inset 0 0 0 30px rgba(0, 0, 0, 0.25);
  }

  h1 {
    position: relative;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 2.6rem;
    line-height: 1;
    letter-spacing: -0.03em;
    margin: 0;
  }

  h1 em { color: var(--accent); }

  .subtitle {
    position: relative;
    color: var(--ink-soft);
    font-size: 0.95rem;
    margin: 10px 0 26px;
    max-width: 62%;
  }

  .demo-line {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 1.6rem;
    text-align: center;
    border-top: 2px solid var(--rule);
    border-bottom: 2px solid var(--rule);
    padding: 14px 0;
    margin: 0 0 30px;
  }

  .kline { position: relative; display: inline-block; white-space: nowrap; color: var(--ink-faint); }
  .kline .fill {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 0;
    overflow: hidden;
    color: var(--accent);
    animation: sweep 5s linear infinite;
  }

  @keyframes sweep { 0% { width: 0; } 75% { width: 100%; } 100% { width: 100%; } }

  @media (prefers-reduced-motion: reduce) {
    .disc, .kline .fill { animation: none; }
    .kline .fill { width: 45%; }
  }

  /* --- Form --- */

  .field { margin-bottom: 20px; }

  .field > label, .section-label {
    display: block;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .field .hint {
    font-weight: 400;
    letter-spacing: 0;
    text-transform: none;
    color: var(--ink-soft);
    font-size: 0.8rem;
  }

  input[type=text], select, textarea {
    width: 100%;
    padding: 8px 2px;
    font-size: 1rem;
    font-family: inherit;
    color: var(--ink);
    background: transparent;
    border: 0;
    border-bottom: 1.5px solid var(--rule);
    border-radius: 0;
  }

  input[type=text]::placeholder, textarea::placeholder { color: var(--ink-faint); }

  select {
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    padding-right: 24px;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%);
    background-position: calc(100% - 10px) 55%, calc(100% - 5px) 55%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }

  select option { color: #1c1917; }

  textarea {
    resize: vertical;
    border: 1.5px solid var(--rule);
    border-radius: 10px;
    padding: 10px 12px;
    line-height: 1.5;
  }

  input[type=file] {
    width: 100%;
    font-family: inherit;
    font-size: 0.9rem;
    color: var(--ink-soft);
    padding: 6px 0;
    border-bottom: 1.5px solid var(--rule);
  }

  input[type=file]::file-selector-button {
    font: 500 0.85rem var(--font-body);
    color: var(--ink);
    background: transparent;
    border: 1.5px solid var(--rule);
    border-radius: 999px;
    padding: 6px 14px;
    margin-right: 12px;
    cursor: pointer;
  }

  input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 1.5px 0 0 var(--accent);
  }

  textarea:focus-visible { box-shadow: 0 0 0 1.5px var(--accent); }

  .row { display: flex; gap: 20px; }
  .row > .field { flex: 1; min-width: 0; }

  @media (max-width: 520px) {
    .card { padding: 0 20px 28px; }
    .masthead { margin: 0 -20px; padding: 32px 20px 0; }
    h1 { font-size: 2.1rem; }
    .row { flex-direction: column; gap: 0; }
    .demo-line { font-size: 1.3rem; }
  }

  /* Audio source radios rendered as pill chips; the real radio inputs stay in the DOM (and
     keyboard-focusable) for the existing JS, just visually hidden. */
  .source-toggle { display: flex; gap: 8px; flex-wrap: wrap; }
  .source-toggle label {
    display: inline-flex;
    align-items: center;
    padding: 7px 16px;
    border: 1.5px solid var(--rule);
    border-radius: 999px;
    font-size: 0.88rem;
    font-weight: 500;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s, color 0.15s;
  }
  .source-toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
  .source-toggle label:has(input:checked) { background: var(--chip-on-bg); color: var(--chip-on-text); }
  .source-toggle label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }


  /* --- "Find your song" search --- */
  .song-search { position: relative; }
  .song-search input { padding-right: 30px; }
  .search-spinner {
    position: absolute; right: 4px; top: 50%; width: 14px; height: 14px; margin-top: -7px;
    border: 2px solid var(--ink-faint); border-top-color: transparent; border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  .song-results .result { display: flex; gap: 12px; align-items: center; padding: 9px 10px; border-radius: 6px; cursor: pointer; }
  .song-results .result:hover, .song-results .result.active { background: var(--hairline); }
  .song-results .r-main { flex: 1; min-width: 0; }
  .song-results .r-title { text-align: left; font-weight: 700; font-size: 0.95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .song-results .r-meta { color: var(--ink-soft); font-size: 0.8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .song-results .note { padding: 10px; color: var(--ink-soft); font-size: 0.88rem; }
  .song-results .note button { margin-left: 6px; }
  .song-results .note .link-btn { display: inline; margin: 0; font-size: inherit; }
  .badge { flex: none; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 7px; border-radius: 999px; border: 1px solid currentColor; }
  .badge.synced { color: var(--accent); }
  .badge.none { color: var(--ink-faint); }

  .song-card { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border: 1.5px solid var(--rule); border-radius: 14px; }
  .song-card-disc { flex: none; width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle, var(--paper) 0 2px, var(--accent) 3px 9px, var(--groove-a) 10px 11px, var(--groove-b) 12px 13px, var(--groove-a) 14px); }
  .song-card-info { flex: 1; min-width: 0; }
  .song-card-title { font-weight: 700; font-size: 1.05rem; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .song-card-meta { color: var(--ink-soft); font-size: 0.82rem; margin-top: 2px; }

  .local-note { font-size: 0.8rem; color: var(--ink-soft); margin: 8px 0 0; }

  .link-btn {
    width: auto; margin: 8px 0 0; padding: 0; background: none; color: var(--ink-soft);
    font-size: 0.82rem; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; border-radius: 0;
  }
  .link-btn:hover:not(:disabled) { background: none; color: var(--ink); }

  .suggestions {
    list-style: none;
    margin: 6px 0 0;
    padding: 4px;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    z-index: 10;
    background: var(--paper);
    border: 1.5px solid var(--rule);
    border-radius: 10px;
    box-shadow: 0 12px 30px rgba(40, 25, 10, 0.18);
    max-height: 260px;
    overflow-y: auto;
  }

  .suggestions[hidden] { display: none; }


  /* --- Buttons --- */

  button {
    width: 100%;
    margin-top: 10px;
    padding: 15px 22px;
    font-family: var(--font-body);
    font-size: 1rem;
    font-weight: 700;
    color: var(--on-accent);
    background: var(--accent);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.15s, transform 0.1s;
  }

  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:active:not(:disabled) { transform: scale(0.99); }
  button:disabled { opacity: 0.45; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  button.secondary {
    width: auto;
    margin-top: 0;
    color: var(--ink);
    background: transparent;
    border: 1.5px solid var(--rule);
    padding: 7px 16px;
    font-size: 0.85rem;
    font-weight: 500;
  }

  button.secondary:hover:not(:disabled) { background: var(--hairline); }

  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid currentColor;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }

  /* Only while actually working - a merely-disabled button (e.g. Generate before lyrics are
     checked) shouldn't look like it's loading. */
  button.loading .spinner { display: inline-block; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .youtube-row { display: flex; gap: 10px; align-items: center; }
  .youtube-row input { flex: 1; }

  .lyrics-check-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 4px 0 20px; }

  .lyrics-status { display: inline-block; font-size: 0.85rem; font-weight: 500; margin-top: 8px; }
  .lyrics-check-row .lyrics-status { margin-top: 0; }
  .lyrics-status.found { color: var(--success); }
  .lyrics-status.not-found { color: var(--error); }
  .lyrics-status.checking { color: var(--ink-soft); font-weight: 400; }


  /* --- Job status / result --- */

  #status {
    margin-top: 26px;
    padding: 18px 20px;
    border-radius: 14px;
    border: 1.5px solid var(--rule);
    display: none;
  }

  #status.error { background: var(--error-bg); color: var(--error); border-color: var(--error); }
  #status.done { background: var(--done-bg); color: var(--ink); }

  .stage-label { font-size: 0.92rem; font-weight: 500; margin-bottom: 10px; overflow-wrap: anywhere; }
  #status.done .stage-label { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; color: var(--success); }

  .progress-track {
    width: 100%;
    height: 5px;
    border-radius: 5px;
    background: var(--hairline);
    overflow: hidden;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    background: var(--ink);
    border-radius: 5px;
    transition: width 0.3s ease;
  }

  .progress-track.indeterminate .progress-fill {
    width: 40% !important;
    animation: indeterminate 1.3s ease-in-out infinite;
  }

  @keyframes indeterminate {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(250%); }
  }

  .status-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; }
  .status-footer:has(#cancel-btn[hidden]):has(#status-meta:empty) { display: none; }
  .status-meta { font-size: 0.82rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  video { width: 100%; border-radius: 10px; margin-top: 14px; display: block; background: #000; }

  a.download {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 18px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 700;
    font-size: 0.9rem;
    text-decoration: none;
  }

  a.download:hover { background: var(--accent-hover); }

  .warnings {
    margin-top: 14px;
    padding: 12px 16px;
    background: var(--warning-bg);
    color: var(--warning-text);
    border-radius: 10px;
    font-size: 0.85rem;
    line-height: 1.5;
  }

  .warnings ul { margin: 6px 0 0; padding-left: 20px; }

  /* --- "Your videos" library --- */

  .library { margin-top: 40px; }

  .library h2 {
    font-family: var(--font-display);
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 4px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--rule);
  }

  .library-empty { color: var(--ink-soft); font-size: 0.9rem; padding: 14px 0; }

  .track { border-bottom: 1px solid var(--hairline); padding: 12px 0; }

  .track-row { display: flex; align-items: center; gap: 14px; }

  .track-num {
    flex: none;
    width: 26px;
    font-family: var(--font-display);
    font-weight: 700;
    color: var(--accent);
    font-size: 1.05rem;
  }

  .track-info { flex: 1; min-width: 0; }
  .track-title { text-align: left; font-weight: 700; font-size: 0.98rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track-meta { color: var(--ink-soft); font-size: 0.8rem; margin-top: 2px; }

  .track-actions { display: flex; gap: 8px; flex: none; }
  a.btn-secondary {
    display: inline-flex;
    align-items: center;
    color: var(--ink);
    border: 1.5px solid var(--rule);
    border-radius: 999px;
    padding: 7px 16px;
    font-size: 0.85rem;
    font-weight: 500;
    text-decoration: none;
  }
  a.btn-secondary:hover { background: var(--hairline); }
  .track video { margin-top: 12px; }

  @media (max-width: 520px) {
    .track-row { flex-wrap: wrap; }
    .track-actions { width: 100%; padding-left: 40px; }
  }
  .warnings li { margin-bottom: 4px; }
</style>
</head>
<body>
<div class="card">
  <header class="masthead">
    <div class="disc" aria-hidden="true"></div>
    <h1>Karao<em>kit</em></h1>
    <p class="subtitle">Turn any song into a karaoke video with an animated, word-by-word highlight.</p>
    <div class="demo-line" aria-hidden="true">
      <span class="kline">Sing along, word by word<span class="fill">Sing along, word by word</span></span>
    </div>
  </header>

  <form id="job-form">
    <div class="field">
      <span class="section-label">Audio source</span>
      <div class="source-toggle" id="source-toggle">
        <label><input type="radio" name="source-mode" value="file" id="source-file" checked>Upload a file</label>
        <label id="youtube-choice"><input type="radio" name="source-mode" value="youtube" id="source-youtube">YouTube link</label>
      </div>
      <p class="hint local-note" id="local-note" hidden>Separation runs on this computer (no GPU account configured): expect 10–15 minutes per song.</p>
    </div>

    <div class="field" id="file-source-field">
      <label for="file">Audio file</label>
      <input type="file" id="file" name="file" accept="audio/*" required>
    </div>

    <div class="field" id="youtube-source-field" hidden>
      <label for="youtube-url">YouTube link</label>
      <div class="youtube-row">
        <input type="text" id="youtube-url" name="youtube_url" placeholder="https://www.youtube.com/watch?v=...">
        <button type="button" class="secondary" id="fetch-youtube-btn">
          <span class="spinner"></span>
          <span>Fetch info</span>
        </button>
      </div>
      <span class="lyrics-status" id="youtube-status" hidden></span>
    </div>

    <div class="field">
      <label for="song-search">Song</label>
      <div class="song-search" id="song-search-box">
        <input type="text" id="song-search" dir="auto" autocomplete="off" spellcheck="false"
               placeholder="Search a title or an artist, e.g. Omer Adam מביט מהצד"
               role="combobox" aria-expanded="false" aria-controls="song-results" aria-autocomplete="list">
        <span class="search-spinner" id="search-spinner" hidden></span>
        <div class="suggestions song-results" id="song-results" role="listbox" hidden></div>
      </div>
      <div class="song-card" id="song-card" hidden>
        <div class="song-card-disc" aria-hidden="true"></div>
        <div class="song-card-info">
          <div class="song-card-title" id="song-card-title" dir="auto"></div>
          <div class="song-card-meta" id="song-card-meta"></div>
        </div>
        <button type="button" class="secondary" id="change-song-btn">Change</button>
      </div>
      <span class="lyrics-status not-found" id="song-error" hidden></span>
      <button type="button" class="link-btn" id="manual-toggle" aria-expanded="false" aria-controls="manual-details">Can't find it? Enter details manually</button>
    </div>
    <input type="hidden" name="lrclib_id" id="lrclib-id" disabled>

    <div id="manual-details" hidden>
      <div class="row">
        <div class="field">
          <label for="artist">Artist</label>
          <input type="text" id="artist" name="artist" dir="auto" autocomplete="off">
        </div>
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" dir="auto" autocomplete="off">
        </div>
      </div>
      <div class="field">
        <label for="album">Album <span class="hint">(optional)</span></label>
        <input type="text" id="album" name="album" dir="auto">
      </div>
    </div>

    <div class="field">
      <label for="language">Language <span class="hint" id="language-detected-hint"></span></label>
      <select id="language" name="language">
        <option value="heb" selected>Hebrew</option>
        <option value="eng">English</option>
        <option value="fra">French</option>
        <option value="spa">Spanish</option>
        <option value="rus">Russian</option>
        <option value="ara">Arabic</option>
      </select>
    </div>

    <div class="lyrics-check-row">
      <button type="button" class="secondary" id="check-lyrics-btn" hidden>
        <span class="spinner"></span>
        <span>Check lyrics</span>
      </button>
      <span class="lyrics-status" id="lyrics-status" hidden></span>
      <button type="button" class="secondary" id="review-lyrics-btn" hidden>Edit lyrics</button>
    </div>

    <div class="field">
      <label for="lyrics">Your lyrics <span class="hint" id="lyrics-hint">(optional — if filled, used instead of LRCLIB's)</span></label>
      <textarea id="lyrics" name="lyrics" rows="6" dir="auto" placeholder="Paste lyrics here if the song isn't on LRCLIB, or to correct LRCLIB's version"></textarea>
    </div>

    <button type="submit" id="generate-btn" disabled title="Check lyrics (or paste them below) first">
      <span class="spinner"></span>
      <span class="btn-label">Generate karaoke video</span>
    </button>
  </form>

  <div id="status" aria-live="polite">
    <div class="stage-label"></div>
    <div class="progress-track"><div class="progress-fill" style="width: 0%"></div></div>
    <div class="status-footer">
      <span class="status-meta" id="status-meta"></span>
      <button type="button" class="secondary" id="cancel-btn" hidden>Cancel</button>
    </div>
    <div class="result"></div>
  </div>

  <section class="library" aria-labelledby="library-heading">
    <h2 id="library-heading">Your videos</h2>
    <div id="library-list"><p class="library-empty">Loading…</p></div>
  </section>
</div>

<script>
// Disables a button while its request runs and shows its spinner - kept separate from plain
// `disabled`, which Generate also uses for "not ready yet" (lyrics not checked).
function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

// FastAPI errors come back as {"detail": "..."}; fall back to the raw body otherwise.
async function errorMessage(res) {
  const body = await res.text();
  try {
    return JSON.parse(body).detail || body;
  } catch {
    return body;
  }
}

function setBusy(btn, busy) {
  btn.disabled = busy;
  btn.classList.toggle("loading", busy);
}

const STAGE_LABELS = {
  queued: "Starting…",
  downloading: "Downloading audio from YouTube",
  separating: "Separating vocals from instrumental",
  lyrics: "Preparing lyrics",
  aligning: "Aligning lyrics to vocals",
  rendering_subtitles: "Rendering the karaoke highlight",
  muxing: "Assembling the final video",
  done: "Done!",
  error: "Error",
};

// Alignment reports discrete named sub-steps rather than a continuous percentage; map them to a
// fixed progression instead.
const ALIGN_SUBSTEPS = [
  "loading alignment model",
  "loading vocals audio",
  "running acoustic model",
  "preparing text",
  "computing alignment",
];



// --- Audio source toggle: upload a file, or paste a YouTube link (downloaded server-side as the
// pipeline's first stage). Disabling the inactive input excludes it from the submitted FormData
// entirely, rather than sending an empty value the backend would have to special-case. ---

const fileSourceField = document.getElementById("file-source-field");
const youtubeSourceField = document.getElementById("youtube-source-field");
const fileInput = document.getElementById("file");
const youtubeUrlInput = document.getElementById("youtube-url");
const fetchYoutubeBtn = document.getElementById("fetch-youtube-btn");
const youtubeStatus = document.getElementById("youtube-status");

function applySourceMode() {
  const mode = document.querySelector('input[name="source-mode"]:checked').value;
  const isFile = mode === "file";
  fileSourceField.hidden = !isFile;
  youtubeSourceField.hidden = isFile;
  fileInput.disabled = !isFile;
  fileInput.required = isFile;
  youtubeUrlInput.disabled = isFile;
  youtubeUrlInput.required = !isFile;
}

document.getElementById("source-file").addEventListener("change", applySourceMode);
document.getElementById("source-youtube").addEventListener("change", applySourceMode);
applySourceMode();

const YOUTUBE_URL_RE = /^(https?:\/\/)?((www|m|music)\.)?(youtube\.com\/(watch\?|shorts\/|live\/)|youtu\.be\/)\S+/i;
let lastFetchedUrl = null;
let youtubeDebounce = null;

// Pasting (or finishing typing) a YouTube link fetches its info right away - the "Fetch info"
// button stays as a manual retry.
youtubeUrlInput.addEventListener("input", () => {
  clearTimeout(youtubeDebounce);
  const url = youtubeUrlInput.value.trim();
  if (!YOUTUBE_URL_RE.test(url) || url === lastFetchedUrl) return;
  youtubeDebounce = setTimeout(fetchYoutubeInfo, 400);
});

fetchYoutubeBtn.addEventListener("click", fetchYoutubeInfo);

async function fetchYoutubeInfo() {
  clearTimeout(youtubeDebounce);
  const url = youtubeUrlInput.value.trim();
  if (!url) {
    youtubeStatus.hidden = false;
    youtubeStatus.className = "lyrics-status not-found";
    youtubeStatus.textContent = "Paste a YouTube link first.";
    return;
  }

  setBusy(fetchYoutubeBtn, true);
  youtubeStatus.hidden = false;
  youtubeStatus.className = "lyrics-status checking";
  youtubeStatus.textContent = "Fetching video info...";

  try {
    const res = await fetch(`/api/youtube-metadata?url=${encodeURIComponent(url)}`);
    if (!res.ok) throw new Error(await errorMessage(res));
    const data = await res.json();
    lastFetchedUrl = url;
    youtubeStatus.className = "lyrics-status found";
    youtubeStatus.textContent = `✓ "${data.title}"`;
    clearPickedSong();
    resetLyricsCheck();
    const query = `${data.suggested_artist} ${data.suggested_title}`.trim();
    songSearch.value = query;
    const results = await runSearch(query, { open: false });
    const match = results && strongMatch(results, data.suggested_title, data.duration_sec);
    if (match) {
      pickSong(match);
    } else if (results && results.length) {
      youtubeStatus.textContent = `✓ "${data.title}" — pick the matching song below.`;
      songSearch.focus();
      renderResults();
    } else {
      // Nothing on LRCLIB: fall back to the video's own details (and its description's lyrics).
      artistInput.value = data.suggested_artist;
      titleInput.value = data.suggested_title;
      openManual(true);
      checkLyrics();
    }
  } catch (err) {
    youtubeStatus.className = "lyrics-status not-found";
    youtubeStatus.textContent = "Could not fetch video info: " + err.message;
  } finally {
    setBusy(fetchYoutubeBtn, false);
  }
}

// --- Lyrics check gate: the "Generate" button stays disabled until lyrics are either found on
// LRCLIB (confirmed via this check) or pasted manually into the lyrics textarea. ---

const artistInput = document.getElementById("artist");
const titleInput = document.getElementById("title");
const albumInput = document.getElementById("album");
const lyricsTextarea = document.getElementById("lyrics");
const checkLyricsBtn = document.getElementById("check-lyrics-btn");
const lyricsStatus = document.getElementById("lyrics-status");
const reviewLyricsBtn = document.getElementById("review-lyrics-btn");
const lyricsHint = document.getElementById("lyrics-hint");
const LYRICS_HINT_DEFAULT = lyricsHint.textContent;
const generateBtn = document.getElementById("generate-btn");
const languageSelect = document.getElementById("language");
const languageDetectedHint = document.getElementById("language-detected-hint");

let lyricsConfirmed = false;
let lastCheckedText = null;
// Text this page put into the lyrics field itself (from a lyrics check), as opposed to text the
// user typed: if the song changes, auto-filled lyrics belong to the *old* song and must go.
let autoFilledLyrics = null;

function fillLyricsField(text, hint) {
  lyricsTextarea.value = text;
  autoFilledLyrics = text;
  lyricsHint.textContent = hint;
  updateGenerateButtonState();
}
// Once the user picks a language themselves, stop overriding it with a detected guess - the
// detection is a convenience default, not something that should fight the user's own choice.
let languageManuallySet = false;
languageSelect.addEventListener("change", () => {
  languageManuallySet = true;
  languageDetectedHint.textContent = "";
});

function updateGenerateButtonState() {
  const manualLyrics = lyricsTextarea.value.trim().length > 0;
  generateBtn.disabled = !(lyricsConfirmed || manualLyrics);
  generateBtn.title = generateBtn.disabled ? "Check lyrics (or paste them below) first" : "";
}

function resetLyricsCheck() {
  lyricsConfirmed = false;
  lastCheckedText = null;
  lyricsStatus.hidden = true;
  reviewLyricsBtn.hidden = true;
  languageDetectedHint.textContent = "";
  if (autoFilledLyrics !== null && lyricsTextarea.value === autoFilledLyrics) {
    lyricsTextarea.value = "";
    lyricsHint.textContent = LYRICS_HINT_DEFAULT;
  }
  autoFilledLyrics = null;
  updateGenerateButtonState();
}

[artistInput, titleInput, albumInput].forEach(el => el.addEventListener("input", () => {
  // Hand-edited details no longer describe the song picked in the search box.
  if (!lrclibIdInput.disabled) clearPickedSong({ keepDetails: true });
  resetLyricsCheck();
}));
lyricsTextarea.addEventListener("input", () => {
  if (autoFilledLyrics !== null && lyricsTextarea.value !== autoFilledLyrics) {
    autoFilledLyrics = null;
    lyricsHint.textContent = "(edited — your version will be used)";
  }
  if (!lyricsTextarea.value.trim()) lyricsHint.textContent = LYRICS_HINT_DEFAULT;
  updateGenerateButtonState();
});

checkLyricsBtn.addEventListener("click", checkLyrics);

async function checkLyrics() {
  const artist = artistInput.value.trim();
  const title = titleInput.value.trim();
  if (!artist || !title) {
    lyricsStatus.hidden = false;
    lyricsStatus.className = "lyrics-status not-found";
    lyricsStatus.textContent = "Enter an artist and title first.";
    return;
  }

  setBusy(checkLyricsBtn, true);
  lyricsStatus.hidden = false;
  lyricsStatus.className = "lyrics-status checking";
  lyricsStatus.textContent = "Checking lyrics...";
  reviewLyricsBtn.hidden = true;

  try {
    const params = new URLSearchParams({ artist, title });
    if (albumInput.value.trim()) params.set("album", albumInput.value.trim());
    const inYoutubeMode = document.getElementById("source-youtube").checked;
    if (inYoutubeMode && youtubeUrlInput.value.trim()) {
      params.set("youtube_url", youtubeUrlInput.value.trim());
    }
    const res = await fetch(`/api/lyrics-check?${params}`);
    if (!res.ok) throw new Error(await errorMessage(res));
    const data = await res.json();

    if (data.found) {
      applyFoundLyrics(data);
    } else {
      lyricsConfirmed = false;
      lastCheckedText = null;
      lyricsStatus.className = "lyrics-status not-found";
      lyricsStatus.textContent = data.error
        ? `⚠ ${data.error}`
        : "✗ Not found on LRCLIB — paste the lyrics below to continue.";
    }
  } catch (err) {
    lyricsConfirmed = false;
    lyricsStatus.className = "lyrics-status not-found";
    lyricsStatus.textContent = "Lyrics check failed: " + err.message;
  } finally {
    setBusy(checkLyricsBtn, false);
    updateGenerateButtonState();
  }
}

// Marks lyrics as confirmed (from a search pick, a video description, or a manual check) and
// applies the detected language unless the user already chose one.
function applyFoundLyrics({ text, source, synced, detected_language }) {
  lyricsConfirmed = true;
  lastCheckedText = text;
  lyricsStatus.hidden = false;
  lyricsStatus.className = "lyrics-status found";
  if (source === "youtube_description") {
    lyricsStatus.textContent = "✓ Lyrics found in the video description";
    fillLyricsField(text, "(from the video description — edit freely, this version will be used)");
    reviewLyricsBtn.hidden = true;
  } else {
    lyricsStatus.textContent = `✓ Lyrics ready${synced ? " (synced)" : ""}`;
    reviewLyricsBtn.hidden = false;
  }
  const option = detected_language && languageSelect.querySelector(`option[value="${detected_language}"]`);
  if (option) {
    if (!languageManuallySet) languageSelect.value = detected_language;
    languageDetectedHint.textContent = `(detected: ${option.textContent})`;
  }
  updateGenerateButtonState();
}

// Loads LRCLIB's lyrics into the editable field: whatever is there when generating is what gets
// used (the backend gives pasted lyrics priority over LRCLIB), so fixing a typo is just editing.
reviewLyricsBtn.addEventListener("click", () => {
  if (lastCheckedText === null) return;
  const current = lyricsTextarea.value.trim();
  if (current && current !== (autoFilledLyrics || "").trim() &&
      !confirm("Replace the lyrics already in the field with LRCLIB's version?")) {
    return;
  }
  fillLyricsField(lastCheckedText, "(from LRCLIB — edit freely, this version will be used)");
  reviewLyricsBtn.hidden = true;
  lyricsTextarea.focus();
  lyricsTextarea.setSelectionRange(0, 0);
  lyricsTextarea.scrollIntoView({ behavior: "smooth", block: "center" });
});

// --- "Find your song": one search box over LRCLIB (title and/or artist, any language). Picking a
// result fills artist/title/album, confirms the lyrics that came with it and records its LRCLIB id,
// so the job uses exactly that record. Artist/title fields stay available as a manual fallback. ---

const songSearch = document.getElementById("song-search");
const songSearchBox = document.getElementById("song-search-box");
const songResults = document.getElementById("song-results");
const searchSpinner = document.getElementById("search-spinner");
const songCard = document.getElementById("song-card");
const songCardTitle = document.getElementById("song-card-title");
const songCardMeta = document.getElementById("song-card-meta");
const songError = document.getElementById("song-error");
const lrclibIdInput = document.getElementById("lrclib-id");
const manualToggle = document.getElementById("manual-toggle");
const manualDetails = document.getElementById("manual-details");

let searchTimer = null;
let searchController = null;
let searchResults = [];
let activeResult = -1;

// LRCLIB often stores the artist's name as the album (self-titled uploads) - not worth repeating.
function songMeta(r) {
  const album = r.album && fold(r.album) !== fold(r.artist) ? r.album : null;
  return [r.artist, album, formatDuration(r.duration_sec)].filter(Boolean).map(v => `<bdi>${escapeHtml(v)}</bdi>`).join(" · ");
}

function formatDuration(sec) {
  if (!sec && sec !== 0) return "";
  const s = Math.round(sec);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

function fold(text) {
  return (text || "").normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
}

function setResultsOpen(open) {
  songResults.hidden = !open;
  songSearch.setAttribute("aria-expanded", String(open));
}

function showNote(html) {
  songResults.innerHTML = `<div class="note">${html}</div>`;
  setResultsOpen(true);
}

function renderResults() {
  if (!searchResults.length) {
    showNote('No match. Try other words, or <button type="button" class="link-btn" data-manual>enter details manually</button>.');
    return;
  }
  songResults.innerHTML = searchResults.map((r, i) => {
    const meta = songMeta(r);
    const badge = !r.lyrics ? '<span class="badge none">no lyrics</span>' : r.synced ? '<span class="badge synced">synced</span>' : "";
    return `<div class="result${i === activeResult ? " active" : ""}" role="option" data-index="${i}">
      <div class="r-main"><div class="r-title" dir="auto">${escapeHtml(r.title)}</div><div class="r-meta">${meta}</div></div>${badge}
    </div>`;
  }).join("");
  setResultsOpen(true);
}

async function runSearch(query, { open = true } = {}) {
  clearTimeout(searchTimer);
  if (searchController) searchController.abort();
  query = query.trim();
  if (query.length < 2) {
    searchResults = [];
    setResultsOpen(false);
    return [];
  }
  searchController = new AbortController();
  searchSpinner.hidden = false;
  try {
    const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`, { signal: searchController.signal });
    if (!res.ok) throw new Error(await errorMessage(res));
    const data = await res.json();
    searchResults = data.results || [];
    activeResult = -1;
    // A slow answer (LRCLIB can take seconds) mustn't pop up over whatever the user moved on to.
    if (document.activeElement !== songSearch) open = false;
    if (data.error) {
      if (open) showNote(`${escapeHtml(data.error)} <button type="button" class="secondary" data-retry>Retry</button>`);
    } else if (open) {
      renderResults();
    }
    return searchResults;
  } catch (err) {
    if (err.name === "AbortError") return null;
    if (open) showNote(`Search failed: ${escapeHtml(err.message)} <button type="button" class="secondary" data-retry>Retry</button>`);
    return [];
  } finally {
    searchSpinner.hidden = true;
  }
}

function pickSong(r) {
  resetLyricsCheck();
  artistInput.value = r.artist;
  titleInput.value = r.title;
  albumInput.value = r.album || "";
  lrclibIdInput.value = r.lrclib_id;
  lrclibIdInput.disabled = false;
  songCardTitle.textContent = r.title;
  songCardMeta.innerHTML = songMeta(r);
  songSearchBox.hidden = true;
  songCard.hidden = false;
  songError.hidden = true;
  setResultsOpen(false);
  if (r.lyrics) {
    applyFoundLyrics({ text: r.lyrics, source: "lrclib", synced: r.synced, detected_language: r.detected_language });
  } else {
    lyricsStatus.hidden = false;
    lyricsStatus.className = "lyrics-status not-found";
    lyricsStatus.textContent = "✗ LRCLIB has no lyrics for this song — paste them below to continue.";
  }
}

function clearPickedSong({ keepDetails = false } = {}) {
  lrclibIdInput.value = "";
  lrclibIdInput.disabled = true;
  songCard.hidden = true;
  songSearchBox.hidden = false;
  if (!keepDetails) {
    artistInput.value = "";
    titleInput.value = "";
    albumInput.value = "";
  }
}

songSearch.addEventListener("input", () => {
  clearTimeout(searchTimer);
  songError.hidden = true;
  // Results for the previous text are no longer valid - don't leave them up looking pickable.
  searchResults = [];
  if (songSearch.value.trim().length >= 2) showNote("Searching…");
  else setResultsOpen(false);
  searchTimer = setTimeout(() => runSearch(songSearch.value), 300);
});

songSearch.addEventListener("keydown", (e) => {
  if (songResults.hidden || !searchResults.length) {
    if (e.key === "Enter") e.preventDefault(); // never submit the form from the search box
    return;
  }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault();
    const step = e.key === "ArrowDown" ? 1 : -1;
    activeResult = (activeResult + step + searchResults.length) % searchResults.length;
    renderResults();
  } else if (e.key === "Enter") {
    e.preventDefault();
    pickSong(searchResults[Math.max(activeResult, 0)]);
  } else if (e.key === "Escape") {
    setResultsOpen(false);
  }
});

songSearch.addEventListener("focus", () => {
  if (searchResults.length && songSearch.value.trim()) renderResults();
});
songSearch.addEventListener("blur", () => setTimeout(() => setResultsOpen(false), 150));

songResults.addEventListener("mousedown", (e) => {
  e.preventDefault(); // keep focus in the input so blur doesn't close the list first
  const item = e.target.closest(".result");
  if (item) return pickSong(searchResults[Number(item.dataset.index)]);
  if (e.target.closest("[data-retry]")) return runSearch(songSearch.value);
  if (e.target.closest("[data-manual]")) return openManual(true);
});

document.getElementById("change-song-btn").addEventListener("click", () => {
  clearPickedSong();
  resetLyricsCheck();
  songSearch.focus();
  songSearch.select();
  if (searchResults.length) renderResults();
});

function openManual(open) {
  manualDetails.hidden = !open;
  manualToggle.setAttribute("aria-expanded", String(open));
  manualToggle.textContent = open ? "Hide manual details" : "Can't find it? Enter details manually";
  checkLyricsBtn.hidden = !open;
  setResultsOpen(false);
  if (open) {
    if (!artistInput.value && songSearch.value.trim() && lrclibIdInput.disabled) titleInput.value = songSearch.value.trim();
    artistInput.focus();
  }
}
manualToggle.addEventListener("click", () => openManual(manualDetails.hidden));

// The search returns songs, not exact titles - a pick is "strong" when the title matches and the
// duration agrees with the audio we have (YouTube tells us), so it can be selected without asking.
function strongMatch(results, title, durationSec) {
  const candidates = results.filter(r => r.lyrics && fold(r.title) === fold(title));
  if (!candidates.length) return null;
  if (durationSec) {
    const close = candidates.filter(r => r.duration_sec && Math.abs(r.duration_sec - durationSec) <= 4);
    return close[0] || null;
  }
  return candidates.length === 1 ? candidates[0] : null;
}

// Uploads: suggest a search from the file name ("Artist - Title [id].mp3" and similar).
fileInput.addEventListener("change", () => {
  const file = fileInput.files[0];
  if (!file || !lrclibIdInput.disabled) return;
  const guess = file.name.replace(/\.[^.]+$/, "").replace(/\[[^\]]*\]|\([^)]*\)/g, " ").replace(/[_]+/g, " ").replace(/\s+-\s+/g, " ").replace(/\s+/g, " ").trim();
  if (!guess) return;
  songSearch.value = guess;
  songSearch.focus();
  runSearch(guess);
});

function progressPercent(stage, detail) {
  if (!detail) return null;
  if (stage === "downloading" || stage === "separating" || stage === "rendering_subtitles") {
    const m = /^(\d+)%$/.exec(detail);
    return m ? parseInt(m[1], 10) : null;
  }
  if (stage === "aligning") {
    const idx = ALIGN_SUBSTEPS.indexOf(detail);
    return idx >= 0 ? Math.round(((idx + 1) / ALIGN_SUBSTEPS.length) * 100) : null;
  }
  return null;
}

// --- Overall progress: one bar for the whole job, weighted by how long each stage typically
// takes (measured on real runs: separation and rendering dominate), plus a rough time estimate. ---

const STAGE_WEIGHTS = {
  downloading: 3,
  separating: 40,
  lyrics: 2,
  aligning: 10,
  rendering_subtitles: 37,
  muxing: 8,
};

function stagesFor(fromYoutube) {
  return Object.keys(STAGE_WEIGHTS).filter(s => fromYoutube || s !== "downloading");
}

// Fraction (0-1) of the whole job done, counting the current stage's own percentage when known.
function overallFraction(stages, stage, detail) {
  const idx = stages.indexOf(stage);
  if (idx < 0) return 0;
  const total = stages.reduce((sum, s) => sum + STAGE_WEIGHTS[s], 0);
  const before = stages.slice(0, idx).reduce((sum, s) => sum + STAGE_WEIGHTS[s], 0);
  const within = (progressPercent(stage, detail) ?? 0) / 100;
  return (before + STAGE_WEIGHTS[stage] * within) / total;
}

function formatRemaining(seconds) {
  if (seconds < 60) return "less than a minute left";
  const minutes = Math.round(seconds / 60);
  return `about ${minutes} min left`;
}

const form = document.getElementById("job-form");
const button = generateBtn;
const statusDiv = document.getElementById("status");
const stageLabelDiv = statusDiv.querySelector(".stage-label");
const progressTrack = statusDiv.querySelector(".progress-track");
const progressFill = statusDiv.querySelector(".progress-fill");
const resultDiv = statusDiv.querySelector(".result");
const statusMeta = document.getElementById("status-meta");
const cancelBtn = document.getElementById("cancel-btn");
let pollTimer = null;
let activeJob = null; // { id, fromYoutube }

// The running job survives a page reload: its id is kept in localStorage (a per-browser
// convenience only - the server's in-memory job list is the real state).
const ACTIVE_JOB_KEY = "karaokit.activeJob";
function rememberJob(job) {
  try { job ? localStorage.setItem(ACTIVE_JOB_KEY, JSON.stringify(job)) : localStorage.removeItem(ACTIVE_JOB_KEY); } catch {}
}
function recalledJob() {
  try { return JSON.parse(localStorage.getItem(ACTIVE_JOB_KEY)); } catch { return null; }
}

function showRunning(job) {
  const stages = stagesFor(activeJob.fromYoutube);
  const fraction = overallFraction(stages, job.status, job.detail);
  const idx = stages.indexOf(job.status);
  const stagePct = progressPercent(job.status, job.detail);
  const label = STAGE_LABELS[job.status] || job.status;
  stageLabelDiv.textContent = idx >= 0
    ? `Step ${idx + 1} of ${stages.length} — ${label}${stagePct !== null ? ` · ${stagePct}%` : "…"}`
    : label;
  progressTrack.classList.toggle("indeterminate", idx < 0);
  progressFill.style.width = `${Math.round(fraction * 100)}%`;

  // Only estimate once there's enough signal: early on, one slow step skews everything.
  const elapsed = job.elapsed_sec || 0;
  statusMeta.textContent = fraction > 0.08 && elapsed > 15
    ? `${Math.round(fraction * 100)}% · ${formatRemaining(elapsed * (1 - fraction) / fraction)}`
    : `${Math.round(fraction * 100)}%`;
}

function showFinished(jobId, job) {
  clearInterval(pollTimer);
  rememberJob(null);
  activeJob = null;
  cancelBtn.hidden = true;
  statusMeta.textContent = "";
  progressTrack.style.display = "none";
  setBusy(button, false);
  updateGenerateButtonState();

  if (job.status === "cancelled") {
    statusDiv.className = "";
    stageLabelDiv.textContent = "Cancelled.";
    return;
  }
  if (job.status === "error") {
    statusDiv.className = "error";
    let message = escapeHtml(job.error);
    if (job.error && job.error.includes("No lyrics found")) {
      message += "<br><br>Paste the lyrics into the \"Your lyrics\" field above and try again — " +
        "the separation step already ran, so it'll be reused and this will be faster.";
    }
    stageLabelDiv.innerHTML = message;
    return;
  }
  statusDiv.className = "done";
  stageLabelDiv.textContent = STAGE_LABELS.done;
  let html = `<a class="download" href="/jobs/${jobId}/video" download>Download video (.mkv)</a>`;
  if (job.has_preview) html += `<video controls preload="metadata" src="/jobs/${jobId}/preview"></video>`;
  if (job.warnings && job.warnings.length) {
    html += `<div class="warnings">${job.warnings.length} passage${job.warnings.length === 1 ? "" : "s"} to double-check:` +
      `<ul>${job.warnings.map(w => `<li>${escapeHtml(w)}</li>`).join("")}</ul></div>`;
  }
  resultDiv.innerHTML = html;
  loadLibrary();
}

function watchJob(jobId) {
  clearInterval(pollTimer);
  statusDiv.style.display = "block";
  statusDiv.className = "";
  resultDiv.innerHTML = "";
  progressTrack.style.display = "";
  cancelBtn.hidden = false;
  cancelBtn.disabled = false;
  cancelBtn.textContent = "Cancel";
  setBusy(button, true);

  const tick = async () => {
    let job;
    try {
      const res = await fetch(`/jobs/${jobId}`);
      if (res.status === 404) {
        // The server restarted (jobs live in memory) - nothing left to watch.
        showFinished(jobId, { status: "error", error: "This job is no longer known to the server (it was probably restarted)." });
        return;
      }
      job = await res.json();
    } catch {
      return; // transient network blip - try again on the next tick
    }
    if (job.done || job.status === "error" || job.status === "cancelled") {
      showFinished(jobId, job);
    } else {
      showRunning(job);
    }
  };
  tick();
  pollTimer = setInterval(tick, 2000);
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!artistInput.value.trim() || !titleInput.value.trim()) {
    songError.hidden = false;
    songError.textContent = "Pick a song above, or enter its artist and title manually.";
    if (!lrclibIdInput.disabled) clearPickedSong();
    openManual(true);
    return;
  }
  clearInterval(pollTimer);
  const formData = new FormData(form);
  const fromYoutube = document.getElementById("source-youtube").checked;
  setBusy(button, true);

  statusDiv.style.display = "block";
  statusDiv.className = "";
  resultDiv.innerHTML = "";
  progressTrack.style.display = "";
  progressTrack.classList.add("indeterminate");
  stageLabelDiv.textContent = fromYoutube ? STAGE_LABELS.queued : "Uploading…";
  statusMeta.textContent = "";

  let jobId;
  try {
    const res = await fetch("/jobs", { method: "POST", body: formData });
    if (!res.ok) throw new Error(await errorMessage(res));
    ({ job_id: jobId } = await res.json());
  } catch (err) {
    statusDiv.className = "error";
    stageLabelDiv.textContent = "Couldn't start: " + err.message;
    progressTrack.style.display = "none";
    setBusy(button, false);
    return;
  }

  activeJob = { id: jobId, fromYoutube };
  rememberJob(activeJob);
  watchJob(jobId);
});

cancelBtn.addEventListener("click", async () => {
  if (!activeJob) return;
  cancelBtn.disabled = true;
  cancelBtn.textContent = "Cancelling…";
  try {
    const res = await fetch(`/jobs/${activeJob.id}/cancel`, { method: "POST" });
    if (!res.ok && res.status !== 409) throw new Error(await errorMessage(res));
  } catch (err) {
    cancelBtn.disabled = false;
    cancelBtn.textContent = "Cancel";
    statusMeta.textContent = "Couldn't cancel: " + err.message;
  }
});

// --- "Your videos": every finished video under work/, newest first ---

const LANGUAGE_NAMES = Object.fromEntries([...languageSelect.options].map(o => [o.value, o.textContent]));
const libraryList = document.getElementById("library-list");

function formatDate(iso) {
  const d = new Date(iso);
  return isNaN(d) ? "" : d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
}

async function loadLibrary() {
  let entries;
  try {
    const res = await fetch("/api/library");
    if (!res.ok) throw new Error(await errorMessage(res));
    entries = await res.json();
  } catch (err) {
    libraryList.innerHTML = `<p class="library-empty">Couldn't load your videos: ${escapeHtml(err.message)}</p>`;
    return;
  }
  if (!entries.length) {
    libraryList.innerHTML = '<p class="library-empty">Your finished karaoke videos will show up here.</p>';
    return;
  }
  libraryList.innerHTML = entries.map((e, i) => {
    const slug = encodeURIComponent(e.slug);
    // <bdi> keeps an RTL artist name from flipping the order of the whole line.
    const meta = [e.artist, LANGUAGE_NAMES[e.language], formatDate(e.created_at), `${Math.round(e.size_bytes / 1e6)} MB`]
      .filter(Boolean).map(v => `<bdi>${escapeHtml(v)}</bdi>`).join(" · ");
    return `<div class="track">
      <div class="track-row">
        <div class="track-num">${String(i + 1).padStart(2, "0")}</div>
        <div class="track-info">
          <div class="track-title" dir="auto">${escapeHtml(e.title)}</div>
          <div class="track-meta">${meta}</div>
        </div>
        <div class="track-actions">
          <button type="button" class="secondary" data-play="${slug}">Play</button>
          <a class="btn-secondary" href="/library/${slug}/video" download>Download</a>
        </div>
      </div>
    </div>`;
  }).join("");
}

libraryList.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-play]");
  if (!btn) return;
  const track = btn.closest(".track");
  const existing = track.querySelector("video");
  if (existing) {
    existing.remove();
    btn.textContent = "Play";
    return;
  }
  const video = document.createElement("video");
  video.controls = true;
  video.autoplay = true;
  video.src = `/library/${btn.dataset.play}/preview`;
  track.appendChild(video);
  btn.textContent = "Close";
});

loadLibrary();

// Only offer what this installation supports (see config.py / .env).
(async () => {
  try {
    const res = await fetch("/api/config");
    if (!res.ok) return;
    const cfg = await res.json();
    if (!cfg.youtube_enabled) {
      document.getElementById("youtube-choice").hidden = true;
      document.getElementById("source-file").checked = true;
      applySourceMode();
    }
    document.getElementById("local-note").hidden = cfg.separation !== "local";
  } catch {}
})();

// Pick a running job back up after a reload.
(async () => {
  const saved = recalledJob();
  if (!saved || !saved.id) return;
  activeJob = saved;
  watchJob(saved.id);
})();
</script>
